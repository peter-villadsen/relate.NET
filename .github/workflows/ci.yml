name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 10 compiles everything (the F# tests use F# 9+ nullness syntax);
      # the 8.0 runtime runs the net8.0 test assemblies.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # relate_ffi.dll is downloaded and SHA-256 verified by build/RelateNative.targets;
      # cache it per pinned version + hash so most runs skip the 74 MB download.
      - name: Cache relate native library
        uses: actions/cache@v4
        with:
          path: native
          key: relate-native-${{ hashFiles('Directory.Build.props', 'build/RelateNative.targets') }}

      - name: Restore
        run: dotnet restore Relate.Net.sln

      - name: Build
        run: dotnet build Relate.Net.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Relate.Net.sln --configuration Release --no-build
          --logger "trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack src/Relate.Net/Relate.Net.csproj --configuration Release --no-build --output artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
